services:
  amr_dispatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
      - ../config:/workspace/src/amr_dispatcher_all/config
    environment:
      - ROS_DOMAIN_ID=42
    command: /bin/bash -c "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 launch /workspace/src/amr_dispatcher_all/launch/full_system.launch.py"
