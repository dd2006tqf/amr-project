name: AMR Dispatcher CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 零 ROS 核心：纯 CMake + GoogleTest，秒级完成。
  # 保留在宿主机直接构建的方式，因为这是 amr_dispatcher_core 被设计成的使用形态
  # （零 ROS 依赖，可脱离 ROS 环境独立编译测试）。
  build-and-test-core:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: upper/amr
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libyaml-cpp-dev libgtest-dev

      # 与 scripts/build.sh 的 cmake 参数保持一致（含 -DCMAKE_BUILD_TYPE=Release），
      # 这样后面 check_all.sh 内部再次 configure 时是 no-op，不会触发二次全量编译。
      - name: Build Core
        # 显式指定 bash：下面的 `source` 需要 bash，不能靠 runner 默认 shell。
        # （ubuntu-* runner 目前默认就是 bash -e，但这是 runner 的隐含行为，
        #   不写死会在 runner 镜像变化时静默失效。）
        shell: bash
        run: |
          cmake -S src/amr_dispatcher_core -B build/core -DBUILD_TESTING=ON \
                -DCMAKE_CXX_FLAGS="-std=c++20" -DCMAKE_BUILD_TYPE=Release
          # 并发度走统一推导脚本（与 scripts/build.sh 同一份实现）。CI 上
          # 16 GB / 4 vCPU 仍会算出 4，与原来的 -j$(nproc) 等价；改成推导的
          # 目的是让「改并发策略」只有一处，避免 CI 与本地/部署三套行为分叉。
          #
          # ⚠️ build_workers.sh 是可执行脚本（stdout 输出整数），不是函数库。
          # `source` 它再调 $(build_workers) 会因函数不存在得到空值，
          # 而 `-j""` 在 cmake 里表示**不限并发**（2026-11-09 修复）。
          WORKERS="$(bash "${GITHUB_WORKSPACE}/upper/amr/scripts/lib/build_workers.sh")"
          case "$WORKERS" in
            '' | *[!0-9]*) WORKERS=1 ;;
          esac
          echo "build workers: $WORKERS"
          cmake --build build/core -j"$WORKERS"

      - name: Run Core Tests
        run: |
          ctest --test-dir build/core --output-on-failure

      # 全链路自检：复用上面已构建好的 build/core（增量，几乎无重复编译）。
      # 纯宿主机（ubuntu-22.04，无 ROS）下 BT/colcon 阶段如实记为 SKIPPED，不算失败；
      # verdict=FAILED 时脚本以非零退出使 CI 变红；测试矩阵写入 test_report_matrix.json。
      - name: Run Full Check Pipeline (check_all.sh)
        run: ./scripts/check_all.sh

  # 完整 ROS 2 工作区：用官方 jazzy 镜像做 colcon 构建。
  #
  # 为什么必须有这个 job
  # -------------------
  # 上面那个零 ROS 的 job 覆盖不到 colcon 层面的问题。实际踩到过的例子：
  # src/amr_dispatcher_tools/include/ 下没有任何被跟踪文件，而 git 不跟踪空目录，
  # 于是从仓库全新 clone 后该目录不存在，amr_dispatcher_tools 的
  # install(DIRECTORY include/ ...) 直接失败并连带中止 amr_dispatcher_ros。
  # 该问题只在全新 clone 时暴露（开发机上那个目录一直存在），本地 cmake/colcon
  # 构建与全部测试都能通过（测试数量随开发演进，不写死具体数字），一路溜到部署到服务器才炸。
  # CI 每次都是全新 clone，因此这个 job 是发现此类问题的唯一关口。
  build-ros2-jazzy:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    defaults:
      run:
        working-directory: upper/amr
    steps:
      - uses: actions/checkout@v4

      # 基础镜像已含大部分依赖，这里只补 behaviortree_cpp 与 hardware_interface
      # （与 docker/Dockerfile.jazzy 的清单保持一致）。
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-behaviortree-cpp \
            ros-jazzy-hardware-interface \
            build-essential \
            libyaml-cpp-dev \
            libgtest-dev \
            libprotobuf-dev \
            protobuf-compiler \
            python3-protobuf \
            pybind11-dev
          rm -rf /var/lib/apt/lists/*

      # 两阶段构建：amr_dispatcher_bt / _ros / _tools 依赖 interfaces 生成的消息头，
      # 必须先单独构建 core + interfaces。
      # shell 必须是 bash —— 容器默认是 sh，`source` 不可用。
      - name: Build All Packages (colcon)
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --symlink-install \
            --packages-select amr_dispatcher_core amr_dispatcher_interfaces \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          # proto 包单独一批，但它**不依赖** interfaces：整个
          # amr_dispatcher_proto 源码树里没有任何对 amr_dispatcher_interfaces
          # 的 include（已 grep 核实），只依赖 rclcpp / rosidl_runtime_* /
          # fastcdr / libprotobuf。分两批建只是为了隔离构建失败面。
          colcon build --base-paths src --symlink-install \
            --packages-select amr_dispatcher_proto \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          # proto_cli 必须等 proto 安装完：它 package.xml 里 depend proto，
          # 提前放进上一批会让 colcon 找不到 amr_dispatcher_proto 的 package.sh。
          colcon build --base-paths src --symlink-install \
            --packages-select amr_dispatcher_bt amr_dispatcher_ros amr_dispatcher_tools \
            amr_dispatcher_proto_cli amr_dispatcher_proto_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      # 这一步专门守住「装了但没装全」的情况：amr_dispatcher_tools 安装失败时
      # colcon 仍可能以退出码 0 收尾，必须显式断言全部包都在。
      #
      # 数量从 5 改成 7：阶段 1/2 proto 迁移新增了 amr_dispatcher_proto
      # （类型与 typesupport）和 amr_dispatcher_proto_cli（ros2 amr echo 等）。
      # 再改成 8：阶段 3 新增 amr_dispatcher_proto_bridge（反向投影与双订阅适配器）。
      - name: Verify All 8 Packages Installed
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash

          installed=$(ls -d install/amr_dispatcher_* | wc -l)
          echo "install/ 下的包数: $installed"
          ls -d install/amr_dispatcher_*
          if [ "$installed" -ne 8 ]; then
            echo "::error::期望 install 8 个包，实际 $installed 个"
            exit 1
          fi

          for p in amr_dispatcher_core amr_dispatcher_interfaces amr_dispatcher_proto \
                   amr_dispatcher_proto_cli amr_dispatcher_proto_bridge \
                   amr_dispatcher_bt \
                   amr_dispatcher_ros amr_dispatcher_tools; do
            if ! ros2 pkg prefix "$p" >/dev/null 2>&1; then
              echo "::error::ros2 找不到包 $p"
              exit 1
            fi
            echo "OK  $p"
          done

      # 确认 10 个可执行文件都产出了（launch 文件依赖它们）
      - name: Verify Expected Executables Exist
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          missing=0
          for exe in chassis_driver_node dispatcher_node safety_gate_node \
                     path_tracker_node link_health_publisher \
                     dispatcher_visualizer_node lifecycle_coordinator_node \
                     navigate_sequence_bridge_node; do
            if [ ! -x "install/amr_dispatcher_ros/lib/amr_dispatcher_ros/$exe" ]; then
              echo "::error::缺失可执行文件 $exe"
              missing=1
            fi
          done
          for exe in dispatcher_cli rest_gateway; do
            if [ ! -x "install/amr_dispatcher_tools/lib/amr_dispatcher_tools/$exe" ]; then
              echo "::error::缺失可执行文件 $exe"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "10 个可执行文件全部就位"
          exit "$missing"

      # 各包单测。tools 与 ros 的用例数随开发演进（不写死数字），
      # 但任何一个包失败都必须让 job 变红——此前只跑 core + bt，
      # 网关的四组纯逻辑与 L2 契约测试在 CI 里从未被执行过。
      - name: Run Unit Tests (core / bt / tools / ros)
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          for pkg in amr_dispatcher_core amr_dispatcher_bt \
                     amr_dispatcher_tools amr_dispatcher_ros; do
            if [ -d "build/${pkg}" ]; then
              echo "=== ctest: ${pkg} ==="
              ctest --test-dir "build/${pkg}" --output-on-failure
            fi
          done

      # proto_cli 是纯 Python 包，没有 ctest 目标，pytest 单独跑。
      #
      # 为什么它必须有测试：2026-11-07 在部署环境发现 `ros2 amr echo` 完全不可用
      # （AttributeError: GetMessageClass），根因是 protobuf 4.22+ 才有的 API
      # 被用在了 4.21 上。该包此前零测试，所以一个只在部署环境显形的 API 差异
      # 直接击穿了「这是唯一能读懂 *_proto 话题的工具」这条承诺。
      #
      # 这些用例里有强制走旧 API 路径的一项（monkeypatch 摘掉 GetMessageClass），
      # 因而能在 protobuf 较新的 CI 镜像上复现部署环境的失败，而不是只在
      # 开发机上全绿。
      - name: Run proto CLI Tests (pytest)
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cd src/amr_dispatcher_proto_cli
          python3 -m pytest test/ -v

  # e2e 门禁 job（10 套脚本串行）。
  #
  # 直接在 ros:jazzy-ros-base 容器 job 内以 AMR_E2E_INNER=1 运行：
  # 这些脚本都带"内层执行守卫"（检测到未设置 AMR_E2E_INNER 才尝试 docker exec
  # 穿透），因此在容器里直接跑不会去找 amr_dispatcher 容器，也不需要 DinD。
  # 相位 11 的两套新脚本本身是 "docker exec 驱动" 的写法，它们复用
  # scripts/lib/inner_docker_shim.sh 把 docker exec/cp/ps 顶成本地执行——
  # 因此断言序列与在宿主机穿透容器时逐字相同，只有"在哪里执行"不同。
  #
  # web 控制台 e2e 不在这里：它需要宿主机 Chrome + 独立容器，放进手动/nightly
  # job（见 README 的"验证"一节），常规 CI 不把它当成门禁。
  e2e-fleet:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    # 10 套 e2e 串行执行（其中拓扑热更新与探针守护各约 2 分钟，含各自的
    # 栈拉起/冷启动），20 分钟余量不足；40 分钟仍能在一个 runner 上跑完，
    # 且超时时会明确失败而不是被"还没跑完"静默截断。
    timeout-minutes: 40
    needs: build-ros2-jazzy
    defaults:
      run:
        working-directory: upper/amr
    steps:
      - uses: actions/checkout@v4

      # 依赖清单与 build-ros2-jazzy 保持一致，额外补 e2e 需要的地图服务与 MQTT：
      #   nav2_map_server  -> check_map_ingest_e2e.sh
      #   mosquitto + paho -> check_vda5050_e2e.sh
      - name: Install E2E Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-behaviortree-cpp \
            ros-jazzy-hardware-interface \
            ros-jazzy-nav2-map-server \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ros \
            mosquitto \
            python3-paho-mqtt \
            python3-yaml \
            curl \
            procps \
            build-essential \
            libyaml-cpp-dev \
            libgtest-dev \
            libprotobuf-dev \
            protobuf-compiler \
            python3-protobuf \
            pybind11-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build Workspace
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --symlink-install \
            --packages-select amr_dispatcher_core amr_dispatcher_interfaces \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          # proto 包单独一批，但它**不依赖** interfaces：整个
          # amr_dispatcher_proto 源码树里没有任何对 amr_dispatcher_interfaces
          # 的 include（已 grep 核实），只依赖 rclcpp / rosidl_runtime_* /
          # fastcdr / libprotobuf。分两批建只是为了隔离构建失败面。
          colcon build --base-paths src --symlink-install \
            --packages-select amr_dispatcher_proto \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          # proto_cli 必须等 proto 安装完：它 package.xml 里 depend proto，
          # 提前放进上一批会让 colcon 找不到 amr_dispatcher_proto 的 package.sh。
          colcon build --base-paths src --symlink-install \
            --packages-select amr_dispatcher_bt amr_dispatcher_ros amr_dispatcher_tools \
            amr_dispatcher_proto_cli amr_dispatcher_proto_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      # 阶段 2 双发的独立验证：真进程 + 真 DDS，逐字段比对 rosidl 与 proto。
      # 放在 e2e job 而不是单测 job，因为它需要完整的 colcon 工作区与运行中的
      # DDS 环境；纯 ctest 覆盖不到「节点漏调 Publish()」这类静默缺陷。
      - name: Proto Dual-Publish Consistency E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_proto_dual_e2e.sh

      - name: Map Ingest E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_map_ingest_e2e.sh

      - name: VDA 5050 Fleet E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_vda5050_e2e.sh

      - name: REST Gateway Hardening E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_rest_gateway_hardening.sh

      - name: State Persistence & Crash Recovery E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_state_persistence_e2e.sh

      - name: Prometheus Metrics Exposition E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_metrics_e2e.sh

      - name: Traffic Coordination & Deadlock Recovery E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_traffic_coordination_e2e.sh

      - name: Industrial Facility Integration E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_facility_integration_e2e.sh

      - name: CBS Multi-Agent Coordination E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_cbs_coordination_e2e.sh

      # 相位 11：探针/守护与拓扑热生效。
      # 两个脚本都支持 AMR_E2E_INNER：内层模式下 docker 子命令由
      # scripts/lib/inner_docker_shim.sh 顶成本地执行，因此不需要 DinD，
      # 断言序列与在宿主机穿透容器时逐字相同（只有"在哪里执行"不同）。
      - name: Probes, Respawn & Webhook Alerting E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_health_supervision_e2e.sh

      - name: Topology Hot-Update E2E
        shell: bash
        env:
          AMR_E2E_INNER: "1"
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./scripts/check_topology_hot_update_e2e.sh

      # 失败时把 e2e 现场日志带出来（脚本把 TMP_DIR 打在输出里，
      # 这里按前缀兜底收集），否则只能看 GitHub 的日志行数上限。
      - name: Upload E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/amr_*/**/*.log
            /tmp/amr_*/**/*.jsonl
          if-no-files-found: ignore
